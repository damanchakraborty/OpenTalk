<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ChudChat</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>


<<!-- ===================================================== -->
<!-- EMAIL OTP AUTH -->
<!-- ===================================================== -->

<section
    id="auth-screen"
    class="auth-screen"
>

    <div class="auth-box">

        <h1>ChudChat</h1>

        <p class="auth-subtitle">
            Sign in with your email.
        </p>

        <div
            id="auth-error"
            class="auth-error"
        ></div>


        <!-- EMAIL -->

        <form
            id="email-form"
            class="auth-form"
        >

            <input
                id="auth-email"
                type="email"
                placeholder="Email"
                autocomplete="email"
                required
            >

            <button type="submit">
                Send verification code
            </button>

        </form>


        <!-- OTP -->

        <form
            id="otp-form"
            class="auth-form hidden"
        >

            <input
                id="auth-otp"
                type="text"
                inputmode="numeric"
                autocomplete="one-time-code"
                placeholder="6-digit code"
                maxlength="8"
                required
            >

            <button type="submit">
                Verify code
            </button>

        </form>


        <p
            id="otp-info"
            class="auth-subtitle hidden"
        >
            We sent a verification code to your email.
        </p>


        <button
            id="change-email"
            type="button"
            class="hidden"
        >
            Use a different email
        </button>

    </div>

</section>
<!-- ===================================================== -->
<!-- PROFILE SETUP -->
<!-- ===================================================== -->

<section
    id="profile-screen"
    class="auth-screen hidden"
>

    <div class="auth-box">

        <h1>Welcome!</h1>

        <p class="auth-subtitle">
            Choose your ChudChat username.
        </p>

        <div
            id="profile-error"
            class="auth-error"
        ></div>

        <form
            id="profile-form"
            class="auth-form"
        >

            <input
                id="profile-username"
                type="text"
                placeholder="Username"
                minlength="3"
                maxlength="24"
                autocomplete="off"
                required
            >

            <input
                id="profile-display-name"
                type="text"
                placeholder="Display name"
                maxlength="40"
                autocomplete="off"
                required
            >

            <button type="submit">
                Continue
            </button>

        </form>

    </div>

</section>


<!-- ===================================================== -->
<!-- CHAT -->
<!-- ===================================================== -->

<main
    id="chat-screen"
    class="chat hidden"
>


    <!-- ================================================= -->
    <!-- CHAT HEADER -->
    <!-- ================================================= -->

    <header class="chat-header">

        <div>

            <h1>ChudChat</h1>

            <span id="status">
                Connecting...
            </span>

        </div>


        <div class="user-controls">

            <span id="current-user"></span>

            <button
                id="logout-button"
                type="button"
            >
                Logout
            </button>

        </div>

    </header>


    <!-- ================================================= -->
    <!-- CHAT BODY -->
    <!-- ================================================= -->

    <div class="chat-body">


        <!-- ============================================= -->
        <!-- USER SIDEBAR -->
        <!-- ============================================= -->

        <aside
            id="user-sidebar"
            class="user-sidebar"
        >

            <div class="sidebar-header">

                <h2>Users</h2>

            </div>


            <div class="user-search">

                <input
                    id="user-search"
                    type="text"
                    placeholder="Search users..."
                    autocomplete="off"
                >

            </div>


            <div
                id="user-list"
                class="user-list"
            >

                <div class="sidebar-empty">
                    Loading users...
                </div>

            </div>

        </aside>


        <!-- ============================================= -->
        <!-- CONVERSATION -->
        <!-- ============================================= -->

        <section
            class="conversation"
        >


            <!-- ========================================= -->
            <!-- CONVERSATION HEADER -->
            <!-- ========================================= -->

            <header
                id="conversation-header"
                class="conversation-header"
            >

                <div
                    id="conversation-user"
                    class="conversation-user"
                >
                    <span class="conversation-placeholder">
                        Select a user to start chatting
                    </span>
                </div>

            </header>


            <!-- ========================================= -->
            <!-- MESSAGES -->
            <!-- ========================================= -->

            <section
                id="messages"
                class="messages"
            >

                <div class="empty">
                    Select a user to start a conversation.
                </div>

            </section>


            <!-- ========================================= -->
            <!-- MESSAGE INPUT -->
            <!-- ========================================= -->

            <form
                id="message-form"
                class="message-form"
            >

                <input
                    id="message"
                    type="text"
                    placeholder="Select a conversation..."
                    maxlength="500"
                    autocomplete="off"
                    disabled
                    required
                >

                <button
                    type="submit"
                    disabled
                >
                    ➤
                </button>

            </form>


        </section>


    </div>

</main>


<!-- ===================================================== -->
<!-- SCRIPTS -->
<!-- ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="app.js"></script>

</body>

</html>
