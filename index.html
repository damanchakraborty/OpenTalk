<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OpenTalk</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<!-- Login -->

<section
    id="auth-screen"
    class="auth-screen"
>

    <div class="auth-box">

        <h1>OpenTalk</h1>

        <p class="auth-subtitle">
            Chat with people.
        </p>

        <div
            id="auth-error"
            class="auth-error"
        ></div>

        <button
            id="google-login"
            class="google-login"
            type="button"
        >

            <span class="google-icon">
                G
            </span>

            <span class="google-login-text">
                Continue with Google
            </span>

        </button>

    </div>

</section>


<!-- First-time profile setup -->

<section
    id="profile-screen"
    class="auth-screen hidden"
>

    <div class="auth-box">

        <h1>Welcome!</h1>

        <p class="auth-subtitle">
            One last thing — set up your OpenTalk profile.
        </p>

        <div
            id="profile-error"
            class="auth-error"
        ></div>

        <form
            id="profile-form"
            class="auth-form"
        >
        <div class="avatar-picker">

    <div
        id="profile-avatar-preview"
        class="profile-avatar-preview"
    >
        
    </div>

    <label
        for="profile-avatar-input"
        class="avatar-upload-button"
    >
        
    </label>

    <input
        id="profile-avatar-input"
        type="file"
        accept="image/png,image/jpeg,image/webp"
        hidden
    >

</div>
		
		
		
		
            <input
                id="profile-username"
                type="text"
                placeholder="Username"
                minlength="3"
                maxlength="24"
                autocomplete="off"
                spellcheck="false"
                required
            >

            <input
                id="profile-display-name"
                type="text"
                placeholder="Display name"
                maxlength="40"
                autocomplete="off"
                required
            >

            <button type="submit">
                Continue
            </button>

        </form>

    </div>

</section>


<!-- Main chat -->

<main
    id="chat-screen"
    class="chat hidden"
>

    <!-- Top bar -->

    <header class="chat-header">

        <div>

            <h1>OpenTalk</h1>

            <span id="status">
                Connecting...
            </span>

        </div>

        <div class="user-controls">

            <button
                id="profile-button"
                class="profile-button"
                type="button"
            >

                <span
                    id="profile-button-avatar"
                    class="profile-button-avatar"
                >
                    ?
                </span>

                <span
                    id="current-user"
                    class="profile-button-name"
                ></span>

            </button>

            <button
                id="logout-button"
                type="button"
            >
                Logout
            </button>

        </div>

    </header>


    <div class="chat-body">


        <!-- User / conversation sidebar -->

        <aside
            id="user-sidebar"
            class="user-sidebar"
        >

            <div class="sidebar-header">

                <h2>Users</h2>

            </div>


            <!-- Global chat stays pinned -->

            <button
                id="global-chat-button"
                class="user-item global-chat-item"
                type="button"
            >

                <div
                    class="user-avatar global-chat-avatar"
                >
                    #
                </div>

                <div class="user-info">

                    <div class="user-display-name">
                        Global Chat
                    </div>

                    <div class="user-username">
                        Everyone
                    </div>

                </div>

            </button>


            <!-- Search -->

            <div class="user-search">

                <input
                    id="user-search"
                    type="text"
                    placeholder="Search users..."
                    autocomplete="off"
                >

            </div>


            <!-- Users -->

            <div
                id="user-list"
                class="user-list"
            >

                <div class="sidebar-empty">
                    Loading users...
                </div>

            </div>

        </aside>


        <!-- Mobile sidebar backdrop -->

        <div
            id="mobile-sidebar-backdrop"
            class="mobile-sidebar-backdrop"
        ></div>


        <!-- Conversation -->

        <section class="conversation">

            <header
                id="conversation-header"
                class="conversation-header"
            >

                <button
                    id="mobile-chat-selector"
                    class="mobile-chat-selector"
                    type="button"
                    aria-label="Open conversations"
                    aria-expanded="false"
                >

                    <span></span>
                    <span></span>
                    <span></span>

                </button>


                <div
                    id="conversation-user"
                    class="conversation-user"
                >

                    <span class="conversation-placeholder">
                        Select a user to start chatting
                    </span>

                </div>

            </header>


            <!-- Messages -->

            <section
                id="messages"
                class="messages"
            >

                <div class="empty">
                    Select a user to start a conversation.
                </div>

            </section>


            <!-- Message input -->

            <form
                id="message-form"
                class="message-form"
            >

                <input
                    id="message"
                    type="text"
                    placeholder="Select a conversation..."
                    maxlength="500"
                    autocomplete="off"
                    disabled
                    required
                >

                <button
                    type="submit"
                    disabled
                >
                    ➤
                </button>

            </form>

        </section>

    </div>


    <!-- Profile customization modal -->

    <div
        id="profile-modal"
        class="profile-modal hidden"
    >

        <div
            class="profile-modal-backdrop"
            id="profile-modal-backdrop"
        ></div>

        <section
            class="profile-modal-box"
            role="dialog"
            aria-modal="true"
            aria-labelledby="profile-modal-title"
        >

            <div class="profile-modal-header">

                <div>

                    <h2 id="profile-modal-title">
                        Customize Profile
                    </h2>

                    <p>
                        Change how other people see you.
                    </p>

                </div>

                <button
                    id="profile-modal-close"
                    class="profile-modal-close"
                    type="button"
                    aria-label="Close profile settings"
                >
                    ×
                </button>

            </div>


            <div
                id="profile-custom-error"
                class="auth-error"
            ></div>


            <form
                id="profile-custom-form"
                class="auth-form"
            >

                <div class="profile-preview">

                    <div
                        id="profile-preview-avatar"
                        class="profile-preview-avatar"
                    >
                        ?
                    </div>

                    <div>

                        <div
                            id="profile-preview-name"
                            class="profile-preview-name"
                        >
                            Display Name
                        </div>

                        <div
                            id="profile-preview-username"
                            class="profile-preview-username"
                        >
                            @username
                        </div>

                    </div>

                </div>


                <label
                    for="profile-custom-username"
                >
                    Username
                </label>

                <input
                    id="profile-custom-username"
                    type="text"
                    minlength="3"
                    maxlength="24"
                    autocomplete="off"
                    spellcheck="false"
                    required
                >


                <label
                    for="profile-custom-display-name"
                >
                    Display name
                </label>

                <input
                    id="profile-custom-display-name"
                    type="text"
                    maxlength="40"
                    autocomplete="off"
                    required
                >


                <button
                    id="profile-save-button"
                    type="submit"
                >
                    Save Changes
                </button>

            </form>

        </section>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="app.js"></script>

</body>

</html>
