<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OpenTalk</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<section
    id="auth-screen"
    class="auth-screen"
>

    <div class="auth-box">

        <h1>OpenTalk</h1>

        <p class="auth-subtitle">
            Chat with people.
        </p>

        <div
            id="auth-error"
            class="auth-error"
        ></div>

        <button
            id="google-login"
            class="google-login"
            type="button"
        >

            <span class="google-icon">
                G
            </span>

            <span class="google-login-text">
                Continue with Google
            </span>

        </button>

    </div>

</section>

<section
    id="profile-screen"
    class="auth-screen hidden"
>

    <div class="auth-box">

        <h1>Welcome!</h1>

        <p class="auth-subtitle">
            One last thing — set up your ChudChat profile.
        </p>

        <div
            id="profile-error"
            class="auth-error"
        ></div>

        <form
            id="profile-form"
            class="auth-form"
        >

            <input
                id="profile-username"
                type="text"
                placeholder="Username"
                minlength="3"
                maxlength="24"
                autocomplete="off"
                spellcheck="false"
                required
            >

            <input
                id="profile-display-name"
                type="text"
                placeholder="Display name"
                maxlength="40"
                autocomplete="off"
                required
            >

            <button type="submit">
                Continue
            </button>

        </form>

    </div>

</section>

<main
    id="chat-screen"
    class="chat hidden"
>

    <header class="chat-header">

        <div>

            <h1>OpenTalk</h1>

            <span id="status">
                Connecting...
            </span>

        </div>

        <div class="user-controls">

            <span id="current-user"></span>

            <button
                id="logout-button"
                type="button"
            >
                Logout
            </button>

        </div>

    </header>

    <div class="chat-body">

        
        <aside
            id="user-sidebar"
            class="user-sidebar"
        >

            <div class="sidebar-header">

                <h2>Users</h2>

            </div>
    
    <button
        id="global-chat-button"
        class="user-item global-chat-item"
        type="button"
    >

        <div class="user-avatar global-chat-avatar">
            #
        </div>

        <div class="user-info">

            <div class="user-display-name">
                Global Chat
            </div>

            <div class="user-username">
                Everyone
            </div>

        </div>

    </button>

            <div class="user-search">

                <input
                    id="user-search"
                    type="text"
                    placeholder="Search users..."
                    autocomplete="off"
                >

            </div>

            <div
                id="user-list"
                class="user-list"
            >

                <div class="sidebar-empty">
                    Loading users...
                </div>

            </div>

        </aside>

<div
    id="mobile-sidebar-backdrop"
    class="mobile-sidebar-backdrop"
></div>

        
        <section class="conversation">

<header
    id="conversation-header"
    class="conversation-header"
>

    
    <button
        id="mobile-chat-selector"
        class="mobile-chat-selector"
        type="button"
        aria-label="Open conversations"
        aria-expanded="false"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div
        id="conversation-user"
        class="conversation-user"
    >

        <span class="conversation-placeholder">
            Select a user to start chatting
        </span>

    </div>

</header>

            <section
                id="messages"
                class="messages"
            >

                <div class="empty">
                    Select a user to start a conversation.
                </div>

            </section>

            <form
                id="message-form"
                class="message-form"
            >

                <input
                    id="message"
                    type="text"
                    placeholder="Select a conversation..."
                    maxlength="500"
                    autocomplete="off"
                    disabled
                    required
                >

                <button
                    type="submit"
                    disabled
                >
                    ➤
                </button>

            </form>

        </section>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="app.js"></script>

</body>

</html>
