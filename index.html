<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ChudChat</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>


<!-- ===================================================== -->
<!-- GOOGLE AUTH -->
<!-- ===================================================== -->

<section
    id="auth-screen"
    class="auth-screen"
>

    <div class="auth-box">

        <h1>ChudChat</h1>

        <p class="auth-subtitle">
            Chat with people.
        </p>


        <div
            id="auth-error"
            class="auth-error"
        ></div>


        <button
            id="google-login"
            class="google-login"
            type="button"
        >

            <span class="google-icon">
                G
            </span>

            <span class="google-login-text">
                Continue with Google
            </span>

        </button>

    </div>

</section>



<!-- ===================================================== -->
<!-- PROFILE SETUP -->
<!-- ===================================================== -->

<section
    id="profile-screen"
    class="auth-screen hidden"
>

    <div class="auth-box">

        <h1>Welcome!</h1>

        <p class="auth-subtitle">
            One last thing — set up your ChudChat profile.
        </p>


        <div
            id="profile-error"
            class="auth-error"
        ></div>


        <form
            id="profile-form"
            class="auth-form"
        >

            <input
                id="profile-username"
                type="text"
                placeholder="Username"
                minlength="3"
                maxlength="24"
                autocomplete="off"
                spellcheck="false"
                required
            >


            <input
                id="profile-display-name"
                type="text"
                placeholder="Display name"
                maxlength="40"
                autocomplete="off"
                required
            >


            <button type="submit">
                Continue
            </button>

        </form>

    </div>

</section>



<!-- ===================================================== -->
<!-- CHAT -->
<!-- ===================================================== -->

<main
    id="chat-screen"
    class="chat hidden"
>

    <header class="chat-header">

        <div>

            <h1>ChudChat</h1>

            <span id="status">
                Connecting...
            </span>

        </div>


        <div class="user-controls">

            <span id="current-user"></span>

            <button
                id="logout-button"
                type="button"
            >
                Logout
            </button>

        </div>

    </header>



<div class="chat-body">

    <!-- ============================================= -->
    <!-- USER SIDEBAR -->
    <!-- ============================================= -->

    <aside
        id="user-sidebar"
        class="user-sidebar"
    >

        <div class="sidebar-header">

            <h2>Chats</h2>

        </div>


        <!-- GLOBAL CHAT -->

        <button
            id="global-chat-button"
            class="global-chat-button"
            type="button"
        >

            <div class="user-avatar global-avatar">
                #
            </div>

            <div class="user-info">

                <div class="user-display-name">
                    Global Chat
                </div>

                <div class="user-username">
                    Everyone
                </div>

            </div>

        </button>


        <!-- SEARCH -->

        <div class="user-search">

            <input
                id="user-search"
                type="text"
                placeholder="Search users..."
                autocomplete="off"
            >

        </div>


        <!-- USERS -->

        <div
            id="user-list"
            class="user-list"
        >

            <div class="sidebar-empty">
                Loading users...
            </div>

        </div>

    </aside>



    <!-- ============================================= -->
    <!-- CONVERSATION -->
    <!-- ============================================= -->

    <section
        id="conversation"
        class="conversation"
    >

        <!-- MOBILE BACK BUTTON -->

        <button
            id="back-to-users"
            class="back-to-users"
            type="button"
        >
            ←
            <span>Back</span>
        </button>


        <!-- CONVERSATION HEADER -->

        <header
            id="conversation-header"
            class="conversation-header"
        >

            <div
                id="conversation-user"
                class="conversation-user"
            >

                <span class="conversation-placeholder">
                    Select a user to start chatting
                </span>

            </div>

        </header>


        <!-- MESSAGES -->

        <section
            id="messages"
            class="messages"
        >

            <div class="empty">
                Select a user to start a conversation.
            </div>

        </section>


        <!-- MESSAGE INPUT -->

        <form
            id="message-form"
            class="message-form"
        >

            <input
                id="message"
                type="text"
                placeholder="Select a conversation..."
                maxlength="500"
                autocomplete="off"
                disabled
                required
            >

            <button
                type="submit"
                disabled
            >
                ➤
            </button>

        </form>

    </section>

</div>

</main>



<!-- ===================================================== -->
<!-- SUPABASE -->
<!-- ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="app.js"></script>

</body>

</html>
